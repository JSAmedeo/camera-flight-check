<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Camera Flight Check — Simple Mode</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="stylesheet" href="vendor/fonts/geist.css" />
<link rel="stylesheet" href="simple-styles.css" />

<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Geist", system-ui, sans-serif; overflow: hidden; }
  #simple-root { width: 100%; height: 100%; }

  /* ===== Frameless-window chrome (Electron) ===== */
  /* Round the app shell — the outermost wrapper SimpleApp renders */
  #simple-root > div:first-child {
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.09);
  }
  html.is-fullscreen #simple-root > div:first-child { border-radius: 0; border: none; }

  /* The app's top bar doubles as the title bar: draggable, controls opt out */
  .s-top { -webkit-app-region: drag; }
  .s-top button, .s-top a { -webkit-app-region: no-drag; }

  .s-top-actions { display: flex; align-items: center; gap: 10px; }
  /* "Camera Settings Bypass" is longer than "Get Help" -- shrink its type
     (not .s-help-btn's shared base, that's still used by Get Help) rather
     than letting the button grow past the top bar's other controls. */
  .s-bypass-open-btn { font-size: 12px; padding: 0 12px; gap: 6px; }
  .s-win-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .s-win-btn {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--muted); cursor: pointer; padding: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .s-win-btn:hover { background: var(--card-2); color: var(--text); }
  .s-win-btn--close:hover {
    background: rgba(var(--fail-rgb), 0.18);
    color: color-mix(in srgb, var(--fail), white 35%);
    border-color: rgba(var(--fail-rgb), 0.45);
  }

  /* ===== Camera flow ===== */
  .s-sim-badge {
    padding: 3px 10px; border-radius: var(--radius-pill);
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(var(--warn-rgb), 0.4);
  }
  .s-stats {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; overflow: hidden;
    background: var(--line-soft);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    margin: 6px 0 2px;
  }
  .s-stat {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px;
    background: var(--card);
    font-size: 14px;
  }
  .s-stat-k { color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .s-stat-v { color: var(--text); font-weight: 500; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .s-settings-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; margin: 6px 0 2px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted);
  }
  .s-settings-strip b { color: var(--text); font-weight: 600; }
  .s-photo-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: var(--dim); background: var(--card-soft);
    font-size: 14.5px;
  }
  .s-cam-error {
    display: flex; align-items: flex-start; gap: 10px;
    margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-sm);
    background: var(--fail-soft); border: 1px solid rgba(var(--fail-rgb), 0.35);
    color: var(--text-2); font-size: 14px; line-height: 1.4; text-align: left;
    /* Some messages (the grey-card rejection) are several short paragraphs
       separated by blank lines rather than one block -- preserve those
       instead of collapsing them the way normal text flow would. */
    white-space: pre-line;
  }
  .s-cam-error svg { color: var(--fail); flex: 0 0 auto; margin-top: 2px; }
  .s-cam-warn {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-sm);
    background: var(--warn-soft); border: 1px solid rgba(var(--warn-rgb), 0.4);
    color: var(--text-2); font-size: 14px; line-height: 1.4; text-align: left;
  }
  .s-cam-warn svg { color: var(--warn); flex: 0 0 auto; }
  .s-cam-warn button {
    margin-left: auto; flex: 0 0 auto;
    height: 32px; padding: 0 12px; border-radius: var(--radius-sm);
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .s-cam-warn button:hover { background: var(--card-2); }
  .s-hero-ic--fail { background: var(--fail-soft); color: var(--fail); border: 1px solid rgba(var(--fail-rgb), 0.4); }
  /* Welcome-screen operator form */
  .s-form {
    width: 100%; max-width: 720px;
    display: flex; flex-direction: column; gap: 16px;
    margin-top: 8px;
  }
  .s-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .s-field { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .s-field label {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .s-input {
    height: 56px; padding: 0 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md);
    color: var(--text); font-family: inherit; font-size: 19px; letter-spacing: -0.005em;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .s-input::placeholder { color: var(--dim); }
  .s-input:focus {
    /* Neutral focus treatment — orange is reserved for "current workflow
       step," not every focused field. */
    border-color: var(--text-2);
    box-shadow: 0 0 0 3px rgba(179, 186, 199, 0.18);
  }
  .s-datetime {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 14px 18px;
    background: var(--card-soft); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 16px;
  }
  .s-datetime svg { color: var(--muted); flex: 0 0 auto; }
  .s-datetime b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* subtle settings-refresh affordance above the stats panel */
  .s-refresh-row { width: 100%; display: flex; justify-content: flex-end; margin-bottom: -4px; }
  .s-refresh-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid transparent;
    color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .s-refresh-btn:hover { color: var(--text); border-color: var(--line); background: var(--card); }
  .s-refresh-btn:disabled { cursor: default; }
  .s-refresh-btn--busy svg { animation: refreshSpin 1s linear infinite; }
  @keyframes refreshSpin { to { transform: rotate(360deg); } }

  /* Welcome screen's "Can't find your grey card?" tip -- was styled as a
     bare .s-refresh-btn (a subtle utility affordance), which read as easy
     to miss for something operators actually need before their first
     check. A warm, bordered pill reads as a helpful callout instead. */
  .s-tip-btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 14px; border-radius: var(--radius-pill);
    background: var(--warn-soft); border: 1px solid rgba(var(--warn-rgb), 0.45);
    color: var(--warn); font-family: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .s-tip-btn:hover { background: rgba(var(--warn-rgb), 0.2); border-color: rgba(var(--warn-rgb), 0.65); }
  .s-tip-btn svg { flex: 0 0 auto; }

  /* Walk-around micro-tutorial modal */
  .s-tut-card { max-width: 560px; }
  .s-tut-stage {
    width: 100%; height: 210px;
    margin-top: 14px;
    background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    overflow: hidden;
    animation: s-fadeup-anim 0.25s ease-out;
  }
  .s-tut-caption {
    display: flex; flex-direction: column; gap: 3px;
    margin-top: 14px; text-align: left;
    animation: s-fadeup-anim 0.25s ease-out;
  }
  .s-tut-caption b { font-size: 16px; font-weight: 600; color: var(--text); }
  .s-tut-caption span { font-size: 14px; color: var(--muted); line-height: 1.45; }
  .s-tut-caption--lines { gap: 10px; }
  .s-tut-caption--lines p { margin: 0; font-size: 14.5px; color: var(--text-2); line-height: 1.5; }
  .s-tut-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 18px;
  }
  .s-tut-dots { display: flex; gap: 8px; }
  .s-tut-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--line); border: none; padding: 0; cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .s-tut-dot--on { background: var(--accent-2); transform: scale(1.3); }
  .s-tut-dot--done { background: var(--pass); }
  @keyframes s-fadeup-anim { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* tutorial artwork animations (SVG groups use transform-box for sane origins) */
  .s-tut-stage svg g, .s-tut-stage svg path, .s-tut-stage svg circle, .s-tut-stage svg rect {
    transform-box: fill-box;
  }
  .tut-pulse { animation: tutPulse 1.6s ease-in-out infinite; }
  @keyframes tutPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .tut-blink { animation: tutPulse 0.9s ease-in-out infinite; }
  .tut-blink-slow { animation: tutPulse 1.4s ease-in-out infinite; }
  .tut-wiggle { animation: tutWiggle 1.1s ease-in-out infinite; }
  @keyframes tutWiggle { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .tut-nudge-x { animation: tutNudge 1.1s ease-in-out infinite; }
  @keyframes tutNudge { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, 0); } }
  .tut-sway { animation: tutSway 2.2s ease-in-out infinite; }
  @keyframes tutSway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
  .tut-straighten { animation: tutStraighten 2.4s ease-in-out infinite; }
  @keyframes tutStraighten { 0% { transform: rotate(-14deg); } 40%, 90% { transform: rotate(0deg); } 100% { transform: rotate(-14deg); } }
  .tut-slide-off { animation: tutSlideOff 2.2s ease-in-out infinite; }
  @keyframes tutSlideOff { 0%, 15% { transform: translateX(0); opacity: 1; } 70%, 90% { transform: translateX(74px); opacity: 1; } 100% { transform: translateX(74px); opacity: 0; } }
  .tut-plug-in { animation: tutPlugIn 2s ease-in-out infinite; }
  @keyframes tutPlugIn { 0%, 15% { transform: translateX(-26px); } 60%, 100% { transform: translateX(18px); } }
  .tut-drop { animation: tutDrop 2.4s ease-in-out infinite; }
  @keyframes tutDrop { 0% { transform: translateY(-34px); opacity: 0; } 30%, 90% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
  .tut-slide-up { animation: tutSlideUp 1.8s ease-in-out infinite; }
  @keyframes tutSlideUp { 0%, 20% { transform: translateY(12px); } 60%, 100% { transform: translateY(0); } }
  .tut-dial { animation: tutDial 2.4s ease-in-out infinite; }
  @keyframes tutDial { 0%, 20% { transform: rotate(90deg); } 65%, 100% { transform: rotate(0deg); } }
  .tut-fade-out { animation: tutFadeOut 2.6s ease-in-out infinite; }
  @keyframes tutFadeOut { 0%, 30% { opacity: 1; } 70%, 100% { opacity: 0; } }
  .tut-fade-in { animation: tutFadeIn 2.6s ease-in-out infinite; }
  @keyframes tutFadeIn { 0%, 30% { opacity: 0; } 70%, 100% { opacity: 1; } }

  .s-tut-ph {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: var(--dim);
    border: 2px dashed var(--line); border-radius: var(--radius-sm); margin: 10px;
  }
  .s-tut-ph b { color: var(--muted); font-size: 14px; }
  .s-tut-ph span { font-size: 12px; }
  .s-tut-ph code {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    color: var(--accent-2); background: var(--card); border: 1px solid var(--line);
    padding: 3px 8px; border-radius: 4px;
  }

  /* Guided QA cards on the test-photo review */
  .s-qa { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .s-qa-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 14px 16px;
    transition: opacity 0.2s, border-color 0.2s;
  }
  /* Bumped from 0.45 — upcoming questions still need to look inactive, but
     operators should be able to comfortably read what's coming next. */
  .s-qa-card--pending { opacity: 0.6; }
  .s-qa-card--active { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(var(--accent-2-rgb), 0.12); }
  .s-qa-card--done { border-color: var(--pass-line); }
  .s-qa-head { display: flex; align-items: flex-start; gap: 12px; text-align: left; }
  .s-qa-mark {
    flex: 0 0 auto;
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    display: grid; place-items: center;
    background: var(--card-2); border: 1px solid var(--line);
    color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .s-qa-card--active .s-qa-mark { background: var(--accent-soft); border-color: rgba(var(--accent-2-rgb), 0.4); color: var(--accent-2); }
  .s-qa-card--done .s-qa-mark { background: var(--pass-soft); border-color: var(--pass-line); color: var(--pass); }
  .s-qa-title { font-size: 15.5px; font-weight: 600; color: var(--text); }
  .s-qa-sub { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .s-qa-actions { display: flex; gap: 10px; margin-top: 12px; }
  .s-qa-actions .s-btn {
    height: 42px; font-size: 15px;
    background: var(--card-2); border-color: var(--line); color: var(--text-2);
  }
  /* neutral until the operator commits — green only as hover feedback */
  .s-qa-yes:hover { background: var(--pass-soft); border-color: var(--pass-line); color: var(--pass); }
  .s-qa-actions .s-btn:not(.s-qa-yes):hover { background: var(--card); color: var(--text); }
  .s-hero-ic--sm { width: 84px; height: 84px; border-radius: var(--radius-xl); margin-bottom: 0; }

  /* Found / Fixed summary cards on the applied screen — side-by-side columns */
  .s-summary-grid {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; align-items: start;
    margin-top: 6px;
  }
  .s-summary-card {
    width: 100%;
    display: flex; flex-direction: column;
    padding: 4px 18px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md);
  }
  .s-summary-head {
    padding: 12px 0 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); text-align: left;
  }
  .s-summary-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 0;
    font-size: 14.5px; color: var(--text-2); text-align: left;
  }
  .s-summary-row > svg { color: var(--accent-2); flex: 0 0 auto; }
  .s-summary-row + .s-summary-row { border-top: 1px solid var(--line-soft); }
  .s-fix-ic {
    flex: 0 0 auto;
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    display: grid; place-items: center;
    background: var(--pass-soft); border: 1px solid var(--pass-line); color: var(--pass);
  }
  .s-fix-ic--warn { background: var(--warn-soft); border-color: rgba(var(--warn-rgb), 0.4); color: var(--warn); }
  .s-fix-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .s-fix-body b { font-size: 15px; font-weight: 600; color: var(--text); }
  .s-fix-body span { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .s-fix-set {
    margin-left: auto; flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600; color: var(--pass);
  }

  .s-qa-change {
    margin-left: auto; flex: 0 0 auto; align-self: center;
    height: 30px; padding: 0 12px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .s-qa-change:hover { color: var(--text); border-color: var(--dim); }
  .s-qa-help {
    margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
    background: var(--warn-soft); border: 1px solid rgba(var(--warn-rgb), 0.35);
    color: var(--text-2); font-size: 13.5px; line-height: 1.45; text-align: left;
  }
  .s-qa-help b { color: var(--text); }
  .s-qa-retake { display: flex; width: fit-content; margin-top: 10px; height: 38px; font-size: 14px; }
  .s-qa-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  /* Shared by Test Photo color-fix chips, Skip-reason chips, and Settings
     white-balance presets — compact rounded rectangle, not a pill, so it
     reads as a selectable option control rather than a status/tag pill. */
  .s-qa-chip {
    height: 38px; padding: 0 14px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card-2); border: 1px solid var(--line);
    color: var(--text-2); font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .s-qa-chip:hover { border-color: var(--dim); }
  .s-qa-chip--on { background: var(--warn-soft); border-color: rgba(var(--warn-rgb), 0.5); color: var(--warn); }
  /* "Yes" reads as the positive/expected option even before it's picked,
     not identical to the neutral fix chips beside it. */
  .s-qa-chip--yes { background: var(--pass-soft); border-color: var(--pass-line); color: var(--pass); }
  .s-qa-chip--yes:hover { background: rgba(var(--pass-rgb), 0.18); border-color: var(--pass-line); }
  .s-qa-chip--yes.s-qa-chip--on { background: var(--pass); border-color: var(--pass); color: white; }
  .s-qa-divider { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  /* Escape hatch once a question has already failed a retake once -- dashed
     to read as "alternate path," not a same-weight peer of Yes/No. */
  .s-qa-skip-continue {
    height: 42px; font-size: 14px;
    background: var(--card-2); border: 1px dashed var(--line); color: var(--muted);
  }
  .s-qa-skip-continue:hover { color: var(--text); border-color: var(--dim); border-style: solid; }

  .s-selbox {
    position: absolute;
    border: 2px solid #5eead4;
    background: rgba(94, 234, 212, 0.14);
    border-radius: 3px;
    box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }
  /* Confirm/discard badges on the persisted grey-card box -- confirm sits on
     the top-right corner, discard on the bottom-left. .s-selbox itself has
     pointer-events:none (it's just a visual outline over the photo), so
     these need pointer-events:auto to stay clickable. */
  .s-selbox-btn {
    position: absolute;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    border: none; color: white; cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    transition: filter 0.12s;
  }
  .s-selbox-btn:hover { filter: brightness(1.12); }
  .s-selbox-btn--confirm { top: -14px; right: -14px; background: var(--pass); }
  .s-selbox-btn--discard { bottom: -14px; left: -14px; background: var(--fail); }

  /* Skip-reason modal: a vertical list of full-width selectable rows reads
     more clearly than a wrapping row of variable-width chips, especially
     now that admins can add their own reasons (see Settings > General >
     Skip Reasons) -- an arbitrary-length list needs to scale downward, not
     wrap awkwardly. */
  .s-skip-reasons { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .s-skip-reason {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 13px 16px; border-radius: var(--radius-md);
    background: var(--card-soft); border: 1px solid var(--line);
    color: var(--text-2); font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .s-skip-reason:hover { background: var(--card-2); }
  .s-skip-reason-dot {
    width: 17px; height: 17px; flex: 0 0 auto;
    border-radius: 50%; border: 2px solid var(--line);
    transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
  }
  .s-skip-reason--on {
    background: var(--accent-soft); border-color: rgba(var(--accent-rgb), 0.4); color: var(--text);
  }
  .s-skip-reason--on .s-skip-reason-dot {
    border-color: var(--accent-2); background: var(--accent-2);
    box-shadow: inset 0 0 0 3px var(--card-soft);
  }
  /* Smaller type throughout this one modal (readability at a glance
     mattered more than the larger defaults used for hero-style inputs
     elsewhere), and the free-text "Other" box matches the reason rows'
     full width instead of sizing to its unstyled input default. */
  .s-skip-card .s-info-title { font-size: 19px; }
  .s-skip-card .s-skip-reason { font-size: 14px; padding: 12px 14px; }
  .s-skip-other {
    display: block;
    width: 100%;
    box-sizing: border-box;
    height: auto;
    min-height: 64px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.4;
    resize: none;
  }

  /* ===== Skip control (tertiary — deliberately the quietest button on the
     screen, so busy staff can find it without it competing with Back or the
     primary action) ===== */
  .s-btn--skip {
    height: 52px;
    padding: 0 16px;
    background: transparent;
    border-color: transparent;
    color: var(--dim);
    font-size: 15px;
    font-weight: 500;
  }
  .s-btn--skip:hover { background: var(--card); color: var(--muted); }

  /* ===== Admin Settings screen ===== */
  /* When the settings password is enabled and the session hasn't unlocked
     it yet, the nav+body+footer still render underneath (per design) but
     blurred and inert, with the password gate layered on top asking for the
     password. The gate renders *inside* .s-settings-content-wrap (see
     SettingsPasswordGate's `inline` mode) rather than as a full-viewport
     backdrop -- a full-viewport backdrop has its own backdrop-filter blur,
     which samples everything painted behind it (including the
     "Application Settings" title above) regardless of z-index, since
     .s-info already opens its own stacking context. Scoping the gate to
     just the content area below the title is the only way to keep that
     title crisp while the rest blurs. */
  .s-settings-content-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .s-settings-flex { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .s-settings-blur { filter: blur(6px); pointer-events: none; user-select: none; }
  .s-gate-inline {
    position: absolute;
    inset: 0;
    background: rgba(8, 10, 14, 0.55);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .s-gate-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    padding: 28px 30px;
    width: min(400px, 100%);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }
  .s-gate-icon {
    width: 44px; height: 44px; margin-bottom: 12px;
    border-radius: var(--radius-md);
    background: var(--accent-soft); color: var(--accent-2);
    display: grid; place-items: center;
  }
  .s-settings-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    padding: 30px 32px 26px;
    width: min(1040px, 92%);
    aspect-ratio: 16 / 10;
    max-height: 800px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.03);
  }
  /* Help Config splits Documentation/Contacts into two side-by-side lists
     (see .s-help-config-cols below) -- the fixed 16:10 shape used elsewhere
     reads as cramped once the body holds two columns, so this group gets a
     wider, shallower card instead. */
  .s-settings-card--wide {
    width: min(1320px, 94%);
    aspect-ratio: auto;
    height: min(640px, 88vh);
    max-height: none;
  }
  /* Camera Setting Bypass: same wide shape, but taller -- the photo preview
     alone needs more vertical room than Help Config's two columns did.
     Narrower than the default --wide, now that Presets is a compact card
     list instead of one long inline row of 5 fields. */
  .s-settings-card--bypass { width: min(1080px, 94%); height: min(760px, 92vh); padding-top: 20px; padding-bottom: 16px; }
  /* Condensed chrome scoped to this screen only -- the shared
     .s-settings-title/.s-settings-section h3 sizing is tuned for the
     roomier main Settings screen and reads as wasted space here, where the
     goal is fitting 3 preset cards without scrolling. */
  .s-settings-card--bypass .s-settings-title { font-size: 18px; margin: 0 0 2px; padding-bottom: 8px; }
  .s-settings-card--bypass .s-bypass-col { gap: 8px; }
  /* .s-settings-compact's adjacent-section divider (border-top + padding) is
     tuned for the main Settings screen's General tab -- reusing the class
     here for its input/label sizing also pulled in that divider between
     Camera status and Current settings, which this screen doesn't want;
     spacing between sections here is handled entirely by .s-bypass-col's
     own gap. */
  .s-settings-card--bypass .s-settings-compact .s-settings-section + .s-settings-section {
    margin-top: 0; padding-top: 0; border-top: none;
  }
  /* No border under section headings here -- it read as an extra divider
     between the connection row and Current Settings, and the space it
     took (border + padding) is worth reclaiming for the photo view. */
  .s-settings-card--bypass .s-settings-section h3 { margin-bottom: 4px; padding-bottom: 0; border-bottom: none; }
  /* Current Settings condensed further -- shorter rows, smaller type, tuned
     to leave the photo view as much vertical room as possible. */
  .s-settings-card--bypass .s-bypass-col .s-stat { padding: 4px 10px; font-size: 12.5px; }
  .s-settings-card--bypass .s-bypass-col .s-stat-k { font-size: 10.5px; }
  /* Camera status collapses to one line once connected -- model name +
     Try again share a row instead of a stat box plus a separate button row. */
  .s-bypass-status-section { margin-bottom: 0; }
  .s-bypass-status-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--card-soft); border: 1px solid var(--line); border-radius: var(--radius-sm);
  }
  .s-bypass-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); flex: 0 0 auto; }
  .s-bypass-status-dot--fail { background: var(--fail); }
  .s-bypass-status-row--fail { border-color: rgba(var(--fail-rgb), 0.35); }
  .s-bypass-status-text { flex: 1 1 auto; font-size: 13px; color: var(--text-2); }
  .s-bypass-status-text b { color: var(--text); }
  .s-bypass-status-row .s-btn { flex: 0 0 auto; }
  .s-settings-title {
    font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
    margin: 0 0 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .s-settings-layout {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    gap: 24px;
  }
  .s-settings-nav {
    flex: 0 0 176px;
    display: flex; flex-direction: column; gap: 2px;
    border-right: 1px solid var(--line-soft);
    padding-right: 16px;
    overflow-y: auto;
  }
  .s-settings-nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    padding: 10px 12px; border-radius: var(--radius-md);
    background: transparent; border: 1px solid transparent;
    color: var(--text-2); font-family: inherit; font-size: 14.5px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .s-settings-nav-item svg { flex: 0 0 auto; color: var(--dim); transition: color 0.15s; }
  .s-settings-nav-item:hover { background: var(--card-2); color: var(--text); }
  .s-settings-nav-item--on {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
    border-color: rgba(var(--accent-rgb), 0.35);
  }
  .s-settings-nav-item--on svg { color: var(--accent-2); }
  .s-settings-body {
    flex: 1 1 auto;
    min-width: 0;
    overflow-y: auto;
    padding-right: 8px;
    margin-right: -8px;
    display: flex; flex-direction: column; gap: 26px;
  }
  /* Camera Setting Bypass: two independently-scrolling halves (status/photo/
     current settings on the left, adjust/presets on the right) instead of
     one long single-column scroll -- the left side's content is short and
     fixed, the right side (especially Presets) can grow with however many
     presets exist, so letting them scroll independently keeps the photo and
     status visible without the presets list pushing them off-screen. */
  .s-bypass-columns { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .s-bypass-col { display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 8px; margin-right: -8px; }
  /* Photo view fills whatever vertical room is left after the status row and
     Current Settings above it, but stays portrait (a camera-test photo is
     portrait) -- letting it flex-stretch to whatever shape was left over
     produced a landscape-looking box. Height comes from the flex space
     available; width is derived from that height by the aspect ratio, not
     the column's full width, so it doesn't distort into a wide rectangle. */
  .s-bypass-photo-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1 1 auto; min-height: 160px; }
  .s-bypass-photo {
    position: relative; flex: 1 1 auto; min-height: 0;
    width: auto; max-width: 100%; aspect-ratio: 3 / 4; margin: 0 auto;
    border-radius: var(--radius-md); overflow: hidden;
    background: var(--card-soft); border: 1px solid var(--line);
  }
  .s-bypass-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .s-bypass-photo .s-photo-placeholder { position: absolute; inset: 0; }
  /* Take Photo sits at the very bottom of .s-bypass-col, whose scrollable
     content height is pinned (by the bottom-alignment effect above Current
     Settings) to fill essentially all of the column's available height with
     no slack. The shared .s-btn--primary:active press effect shifts the
     button 1px via transform, which is enough to tip that already-exact fit
     over the edge and pop a scrollbar for the instant the button is held --
     confirmed with a getBoundingClientRect() debug banner. Suppressing just
     the transform here (color/shadow press feedback still applies) keeps the
     tactile click feel everywhere else in the app untouched. */
  .s-bypass-photo-wrap .s-btn:active { transform: none; }
  /* Presets gets its own bounded, internally-scrolling frame so a long list
     of presets doesn't push Adjust Settings (or the Add/Save controls)
     off-screen -- but the right column itself still scrolls too (inherited
     from .s-bypass-col), as a fallback for when even the *minimum* content
     (Adjust Settings + Presets' own header/buttons, before any long list)
     doesn't fit a shorter real window -- without it, that overflow had
     nowhere to go but clipped against the card's own overflow:hidden. */
  /* Shared card frame for the right column's sub-sections (Adjust Settings,
     Presets) -- gives each its own visible boundary instead of just
     whitespace between them. */
  .s-bypass-framed-section {
    border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--card-2); padding: 12px 14px;
  }
  .s-bypass-presets-section {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  }
  .s-bypass-presets-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding-right: 6px; margin-right: -6px;
    display: flex; flex-direction: column; gap: 7px;
  }
  /* Each preset is two connected frames: the card (name, values, edit/
     reorder/remove) and a narrower Apply frame flush to its right, sharing
     one border so they read as a single unit split into two actions. */
  .s-bypass-preset-row { display: flex; }
  .s-bypass-preset-card {
    flex: 1 1 auto; min-width: 0;
    border: 1px solid var(--line-soft); border-right: none;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    background: var(--card-soft);
    padding: 8px 10px;
  }
  .s-bypass-preset-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .s-bypass-preset-title .s-input { height: 24px; font-size: 12px; padding: 0 8px; }
  .s-bypass-preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .s-bypass-preset-grid b { color: var(--text-2); font-weight: 600; }
  .s-bypass-preset-grid input { height: 22px; font-size: 12px; padding: 0 6px; width: 100%; margin-top: 1px; }
  .s-bypass-preset-divider { border-top: 1px solid var(--line-soft); margin: 6px 0; }
  .s-bypass-preset-actions { display: flex; align-items: center; gap: 6px; }
  .s-bypass-preset-apply {
    flex: 0 0 68px;
    border: 1px solid var(--line-soft);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    background: var(--card-2);
    color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 600; line-height: 1.25;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 8px; transition: background 0.15s, color 0.15s;
  }
  .s-bypass-preset-apply:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-2); }
  .s-bypass-preset-apply:disabled { opacity: 0.5; cursor: default; }
  .s-settings-section h3 {
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--accent-2); margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
  }
  .s-settings-toggle {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; color: var(--text-2);
    margin-top: 14px; cursor: pointer;
  }
  .s-settings-toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  /* General tab: condensed to match Help Config's density (28px inputs
     instead of the 56px default, tuned for single hero inputs elsewhere),
     with an explicit divider between subsections rather than relying on
     whitespace alone to separate Location/Data/Password. */
  .s-settings-compact { display: flex; flex-direction: column; }
  .s-settings-compact .s-settings-section + .s-settings-section {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }
  .s-settings-compact .s-form-row { gap: 8px; }
  .s-settings-compact .s-field { gap: 2px; }
  .s-settings-compact .s-field label { font-size: 10.5px; }
  .s-settings-compact .s-input { height: 28px; padding: 0 8px; font-size: 12.5px; }
  .s-settings-compact .s-settings-toggle { font-size: 13px; gap: 8px; margin-top: 4px; }
  .s-settings-compact .s-settings-toggle input { width: 15px; height: 15px; }
  .s-settings-overlay-row { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
  .s-settings-overlay-preview-col { display: flex; flex-direction: column; gap: 10px; }
  .s-settings-overlay-preview {
    position: relative;
    width: 300px; height: 390px;
    border-radius: var(--radius-sm); overflow: hidden;
    background: var(--bg-soft); border: 1px solid var(--line);
  }
  .s-settings-overlay-controls { display: flex; flex-direction: column; gap: 14px; }
  .s-settings-overlay-controls input[type="range"] { width: 100%; accent-color: var(--accent); }

  /* Set Checklist screen only: less vertical space between title/lede/grid
     than the shared .s-screen default, so 2 rows of cards fit without scroll. */
  .s-screen--tight { gap: 12px; }

  /* ===== Set Checklist: 3-column grid of taller cards with bullets
     inline on the card itself, not just in the "More info" panel ===== */
  .s-grid--checklist { grid-template-columns: repeat(3, 1fr); }
  .s-card--checklist { padding: 16px 18px 50px; align-items: stretch; }
  .s-card-head { display: flex; align-items: center; gap: 12px; width: 100%; }
  .s-card-head .s-card-ic { flex: 0 0 auto; width: 44px; height: 44px; }
  .s-card-head .s-card-label { flex: 1 1 auto; padding-right: 24px; font-size: 16px; }
  .s-card-bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .s-card-bullets li {
    position: relative; padding-left: 16px;
    font-size: 13.5px; color: var(--muted); line-height: 1.35; text-align: left;
  }
  .s-card-bullets li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--dim);
  }
  /* Fixed bottom-left, same spot on every card regardless of bullet count
     (previously followed the bullets, so shorter cards read inconsistently). */
  .s-card--checklist .s-card-info { position: absolute; left: 18px; right: auto; bottom: 14px; }
  /* Per-card "not applicable" skip, mirrored to the bottom-right -- some
     stations genuinely don't have a router/webcam/flash to check, and
     forcing them through the whole-screen skip (with its reason prompt)
     for one missing item was the wrong tool for that. */
  .s-card-skip {
    position: absolute;
    bottom: 14px; right: 18px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: var(--radius-sm);
    background: var(--card-soft); border: 1px solid var(--line);
    color: var(--dim); font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
    user-select: none;
  }
  .s-card-skip:hover { background: var(--warn-soft); border-color: rgba(var(--warn-rgb), 0.4); color: var(--warn); }
  .s-card-skip--on { background: var(--warn-soft); border-color: rgba(var(--warn-rgb), 0.4); color: var(--warn); }
  /* Skipped: same "resolved" weight as done, but amber instead of green so
     it reads as "acknowledged, not verified" rather than "checked good." */
  .s-card--skipped { background: rgba(var(--warn-rgb), 0.035); border-color: rgba(var(--warn-rgb), 0.4); }
  .s-card--skipped .s-card-ic { background: var(--warn-soft); border-color: rgba(var(--warn-rgb), 0.4); color: var(--warn); }
  .s-card--skipped .s-card-check { background: var(--warn); border-color: var(--warn); color: #1a1400; }

  /* Settings screen: Help Config (contacts + documentation) editors -- each
     entry framed as its own box, with a gap (rather than a shared divider)
     separating one from the next. */
  .s-help-edit-row {
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    background: var(--card-soft);
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .s-help-edit-row:last-of-type { margin-bottom: 0; }
  /* Condensed fields — the default .s-input/.s-field sizing (56px tall, 8px
     label gap) is tuned for single hero inputs elsewhere; a repeating list
     of small contact/documentation rows reads as oversized at that size. */
  .s-help-edit-row .s-form-row { gap: 8px; }
  .s-help-edit-row .s-field { gap: 2px; }
  .s-help-edit-row .s-field label { font-size: 10.5px; }
  .s-help-edit-row .s-input { height: 28px; padding: 0 8px; font-size: 12.5px; }
  .s-btn--sm {
    height: 24px; padding: 0 10px;
    font-size: 11.5px; border-radius: var(--radius-sm);
  }
  /* Help Config: Documentation (left) and Contacts (right) side by side --
     each column keeps its own natural height; the shared .s-settings-body
     scrolls the pair together. */
  .s-help-config-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  /* The right column stacks Manager Contacts over Additional Contacts. They
     need this wrapper: as separate grid children the second one would wrap
     into column 1, landing under Documentation. */
  .s-help-config-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .s-help-row-actions { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .s-help-row-actions .s-btn--sm:nth-child(1),
  .s-help-row-actions .s-btn--sm:nth-child(2) {
    padding: 0; width: 24px;
  }
  .s-help-reorder-hint { font-size: 10.5px; color: var(--dim); }
  /* Remove sits at the far right of the row, separated from the reorder
     controls on the left. */
  .s-help-row-actions .s-btn--danger { margin-left: auto; }

  /* Auto-filled manager contacts (Help Config). Read-only by design -- the
     location feed rewrites them on every launch -- so they're visually set
     apart from the editable manual rows below and carry a badge saying so. */
  /* The Help Config tab isn't .s-settings-compact, so fields outside an
     .s-help-edit-row (the feed URL) would otherwise render at the full default
     input size and tower over every row beneath them. */
  .s-help-config-cols .s-field label { font-size: 10.5px; }
  .s-help-config-cols .s-input { height: 28px; padding: 0 8px; font-size: 12.5px; }
  /* Read-only value shown under a Settings input -- for a field whose real
     value is derived elsewhere and where the box itself is an override. */
  .s-field-note { font-size: 11px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
  /* The live value shown beside a field's header, so the current location
     reads at a glance without hunting in a locked box. */
  .s-field-value {
    margin-left: 8px;
    color: var(--accent-2);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  /* A field that can't be edited until its Change button is pressed. It has to
     look recessed, not merely empty: --card is the normal input background, so
     dimming the text alone left a locked box indistinguishable from any blank
     field. --card-soft sits darker than the input default, and the softer
     border plus reduced opacity is what actually reads as "locked". */
  .s-input--locked {
    background: var(--card-soft);
    border-color: var(--line-soft);
    color: var(--text-2);
    cursor: default;
    opacity: 0.7;
  }
  .s-field-change { margin-top: 6px; align-self: flex-start; }
  .s-help-auto-note { font-size: 11.5px; color: var(--text-2); margin: -2px 0 8px; }
  .s-help-auto-status { font-size: 11px; color: var(--dim); margin: 8px 0 10px; line-height: 1.45; }
  .s-help-edit-row--auto { position: relative; border-style: dashed; }
  .s-help-edit-row--auto .s-input {
    /* readOnly inputs still look editable otherwise; dim them so nobody
       tries to type into a field the next refresh would overwrite. */
    background: var(--card);
    color: var(--text-2);
    cursor: default;
  }
  /* Same pill recipe as .s-sim-badge, in the Contacts column's green rather
     than the simulator's amber. */
  .s-help-auto-badge {
    position: absolute; top: 10px; right: 12px;
    padding: 2px 8px; border-radius: var(--radius-pill);
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(var(--btn-primary-rgb), 0.14);
    color: var(--btn-primary);
    border: 1px solid rgba(var(--btn-primary-rgb), 0.4);
  }

  /* Welcome screen's "what you'll need" list — one box, thin row dividers,
     rather than a separate card per item (reads as cluttered at only 4 items). */
  .s-needs-box {
    width: 100%;
    background: var(--card-soft);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 2px 16px;
  }
  .s-needs-box ul { list-style: none; margin: 0; padding: 0; }
  .s-needs-box li {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0;
    text-align: left;
  }
  .s-needs-box li:not(:last-child) { border-bottom: 1px solid var(--line-soft); }
  .s-needs-box li b { display: block; font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.005em; }
  .s-needs-box li span { font-size: 14px; color: var(--muted); line-height: 1.4; }
  /* Plain solid bullet here, not the bordered circle used for actual
     checkboxes elsewhere — this list is reference info, not tappable. */
  .s-needs-box .s-checklist-dot {
    width: 6px; height: 6px;
    margin-top: 8px;
    border: none;
    background: var(--dim);
    flex: 0 0 auto;
  }
  /* Sub-bullets for a needs-list item with more than one line (e.g. the
     "character in the chair" fallback note) -- same dot-bullet language as
     .s-card-bullets, scoped here since the needs box has its own sizing. */
  .s-need-sublist {
    list-style: none; margin: 4px 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .s-need-sublist li {
    position: relative;
    /* Full shorthand, not just padding-left -- .s-needs-box li's own
       padding:12px 0 has equal specificity, so a longhand-only override
       here would win for left/right but still leak its top/bottom 12px. */
    padding: 0 0 0 14px !important;
    font-size: 14px; color: var(--muted); line-height: 1.4;
    border-bottom: none !important;
  }
  .s-need-sublist li::before {
    content: ""; position: absolute; left: 0; top: 7px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--dim);
  }

  /* Welcome footer: location + live clock, moved out of the main content
     area to keep that area focused on just the needs list. */
  /* Stacked (location on top, date/time below) rather than one wide row —
     uses the footer's left column height instead of its width. */
  .s-welcome-foot-info {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    color: var(--muted); font-size: 15px;
  }
  .s-welcome-foot-info svg { vertical-align: -2px; margin-right: 2px; color: var(--muted); }
  .s-welcome-foot-info b { color: var(--text); font-weight: 600; }
</style>

<script>
  // Drop the rounded corners when the window covers the whole screen (F11)
  (function () {
    const sync = () => document.documentElement.classList.toggle(
      "is-fullscreen",
      window.innerWidth >= screen.width && window.innerHeight >= screen.height
    );
    window.addEventListener("resize", sync);
    sync();
  })();
</script>
